    @import url('https://fonts.googleapis.com/css2?family=Courgette&display=swap');

    *{
        margin: 0;

        box-sizing: border-box;

    body {
        min-height: 100dvh;
        background-color: aqua;
        font-family: "courgette",sans-serif;

        align-items: center;
    }
    section {
        background-color: azure;
        width: 20rem;
        padding: 1rem;
        border-radius: 8px;
    }
    input {
        height: 40px;
        padding: 2px 10px;
        font-size: 1.1rem;
        width: 100%;
        outline: none;
        border-radius: 8px;
        background-color: blueviolet;
    }
    button{
        background: dodgerblue;
        color: wheat;
        margin-bottom: 20px;
        font-family: courgette;
        font-size: 1.5rem;
        width: 100%;
        padding: 5px;
        border-radius: 4px;
        
    }
