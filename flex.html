<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="moulik sharma"/>
    <title>Flex box</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100dvh;
            font-family: 'Courier New', Courier, monospace;
            font-size: 36px;
            background-color: rgb(0, 80, 166);
            color: aliceblue;


            display: flex;
            flex-direction: column;
        }
        
        header {
            background-color: rgb(0, 0, 0);
            padding: 1rem;
        }

        main {
            flex: 1; 
            color: #ffffff; 
        }

        footer {
            background-color: slatewidth;
            background-color: #110000;
            padding: 1rem;
        }

        section {
            padding: 1rem;
        }
        .box {
            background-color: rgb(0, 0, 0);
            font-size: 50%;
            
        }
        .gc{
            display: grid;
            gap: 1rem;
            grid-template-columns:150px 250px ;
            grid-template-rows: repeat(3,150px);
            place-content: center;

        }

    </style>
</head>
<body>

    <header>
        Header Content
    </header>

    <main>
        <section class="gc">
   <main class="box" id="m1">Content-1</main>
    <main class="box" id="m2">Content-2</main>
    <main class="box" id="m3">Content-3</main>
    <main class="box" id="m4">Content-4</main>
    <main class="box" id="m5">Content-5</main>
    <main class="box" id="m6">Content-6</main>
        </section>

    </main>
 


    <footer>
        Footer Content
    </footer>
    
</body>
</html>
